name: Update ratings data

on:
  schedule:
    # runs daily; the script only changes data/ratings.json when Sagarin posts new numbers
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and parse cfsend page
        run: node scripts/fetch-sagarin.js

      - name: Commit when the data moved
        run: |
          if git diff --quiet -- data/ratings.json; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git add data/ratings.json
          git commit -m "Refresh ratings data from sagarin.com"
          git push
