name: Update ratings data

on:
  schedule:
    # Sagarin posts the new week after Saturday's games, on Sunday. The live file
    # carried Last-Modified "Sun, 18 Oct 2026 14:21:24 GMT", so we run Sunday
    # 17:00 UTC, a couple hours later. Monday is a safety net for a slow week.
    # The script is idempotent, it only writes when the parsed numbers change.
    - cron: "0 17 * * 0"
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and parse cfsend page
        run: node scripts/fetch-sagarin.js

      - name: Commit when the data moved
        run: |
          if git diff --quiet -- data/ratings.json; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git add data/ratings.json
          git commit -m "Refresh ratings data from sagarin.com"
          git push
