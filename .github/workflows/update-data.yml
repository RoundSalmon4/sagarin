name: Update ratings data

on:
  schedule:
    # Sagarin posts the new week after Saturday's games, on Sunday. The live file
    # carried Last-Modified "Sun, 18 Oct 2026 14:21:24 GMT", so we run Sunday
    # 09:00 UTC. Monday is a safety net for a slow week.
    # The script is idempotent, it only writes when the parsed numbers change.
    - cron: "0 9 * * 0"
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and parse cfsend page
        run: node scripts/fetch-sagarin.js

      - name: Fetch ESPN teams and schedules
        run: node scripts/fetch-espn.js

      - name: Fetch team logos
        run: node scripts/fetch-logos.js

      - name: Fetch TV schedule
        run: node scripts/fetch-tv.js

      - name: Archive this week's ratings
        run: node scripts/archive-ratings.js

      - name: Commit when the data moved
        run: |
          git add data/ratings.json data/espn-games.json data/logos.json data/tv-games.json data/history assets/logos assets/conf-logos
          if git diff --cached --quiet; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git commit -m "Refresh ratings, ESPN data, and team logos from sagarin.com and ESPN"
          git push
