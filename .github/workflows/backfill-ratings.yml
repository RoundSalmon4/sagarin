name: Backfill ratings history

# One-time (or occasional) recovery of past weeks from the Wayback Machine.
# Run it by hand from the Actions tab. Leave season blank to use the season in
# data/ratings.json. Dry run just lists what it would write.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to backfill, e.g. 2026. Blank uses the current season."
        required: false
        default: ""
      dry_run:
        description: "Dry run: list weeks without writing or committing"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backfill from the Wayback Machine
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ]; then
            ARGS="$ARGS --season ${{ inputs.season }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          node scripts/fetch-sagarin-history.js $ARGS

      - name: Archive the current week
        if: inputs.dry_run == false
        run: node scripts/archive-ratings.js

      - name: Commit new weeks
        if: inputs.dry_run == false
        run: |
          git add data/history
          if git diff --cached --quiet; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git commit -m "Backfill weekly Sagarin ratings history"
          git push
