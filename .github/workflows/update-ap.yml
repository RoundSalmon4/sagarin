name: Update polls

on:
  schedule:
    # The AP and Coaches polls are released Sunday afternoons at 2 p.m. Eastern
    # during the season (the preseason and final polls are the exceptions).
    # 20:00 UTC covers both EDT and EST. Monday is a safety net for a slow week.
    # The CFP rankings start on Tuesday nights in November, so Wednesday morning
    # picks those up. After the polls are written the BCS-style rating is rebuilt
    # from them and the six live computer rankings. The script is idempotent, it
    # only writes when ranks change.
    - cron: "0 20 * * 0"
    - cron: "0 13 * * 1"
    - cron: "0 3 * * 3"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch polls from ESPN
        run: node scripts/fetch-ap.js

      - name: Build the BCS-style rating
        run: node scripts/fetch-bcs.js
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}

      - name: Commit when a poll moved
        run: |
          git add data/ap-poll.json data/bcs.json
          if git diff --cached --quiet; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git commit -m "Refresh polls from ESPN and the CFP site, and the BCS-style rating"
          git push
