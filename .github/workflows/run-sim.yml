name: Run playoff simulation

permissions:
  contents: write

on:
  schedule:
    - cron: "0 11 * * 0"  # Sunday 11:00 UTC (after Sunday 09:00 update-data)
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write sim output (BCS available for predictor/sim use)
        run: node scripts/run-sim.js
      - name: Commit and push when changed
        run: |
          git add data/sim-12.json data/sim-24.json data/bcs.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="roundsalmon4" -c user.email="209016228+RoundSalmon4@users.noreply.github.com" commit -m "Update simulation results (weekly)"
          git push
