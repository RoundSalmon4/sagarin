name: Run playoff simulation

on:
  schedule:
    - cron: "0 11 * * 0"  # Sunday 11:00 UTC (after Sunday 09:00 update-data)
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Write sim output
        run: node scripts/run-sim.js
      - name: Commit if changed
        run: |
          git add data/sim-12.json
          git diff --cached --quiet && echo "no change" && exit 0
          git -c user.name="roundsalmon4" -c user.email="209016228+RoundSalmon4@users.noreply.github.com" commit -m "Update simulation results (weekly)"
          echo "Committed; push requires PAT (do not commit secret to repo)"
