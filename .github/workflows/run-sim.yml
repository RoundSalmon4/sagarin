name: Run playoff simulation

on:
  schedule:
    - cron: "0 10 * * 6"  # Every Saturday 10:00 UTC (after Sunday data refresh)
  workflow_dispatch:

jobs:
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/run-sim.js
      - run: |
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git add data/sim-12.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Update simulation results (weekly)"
          git -c http.extraHeader="Authorization: Basic $(echo -n 'x-access-token:${{ secrets.GITHUB_TOKEN }}' | base64)" push origin main
