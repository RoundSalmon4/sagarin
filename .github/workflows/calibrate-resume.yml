name: Calibrate resume weights

# Manual trigger. Pulls the CFP final rankings and the paired Sagarin finals from
# Wayback, pulls the committee's actual field for every season, refits the
# resume-score weights and commits them. Run it after a season ends, once the
# committee's final ranking is posted in early December and the bracket is set
# in January.

on:
  workflow_dispatch:
    inputs:
      penalty:
        description: "Loss penalty to hold fixed. Blank uses 5."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch the committee's fields
        run: node scripts/fetch-cfp-fields.js

      - name: Refresh inputs and fit the weights
        run: |
          ARGS="--refresh"
          if [ -n "${{ inputs.penalty }}" ]; then
            ARGS="$ARGS --penalty ${{ inputs.penalty }}"
          fi
          node scripts/calibrate-resume.js $ARGS

      - name: Commit the weights
        run: |
          git add data/cfp-finals.json data/sagarin-finals.json data/cfp-fields.json data/resume-weights.json
          if git diff --cached --quiet; then
            echo "no change, nothing to commit"
            exit 0
          fi
          git config user.name "roundsalmon4"
          git config user.email "209016228+RoundSalmon4@users.noreply.github.com"
          git commit -m "Recalibrate the resume weights"
          git push
